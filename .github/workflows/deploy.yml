name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Lots are pre-rendered by build-pages.mjs at deploy time, read live out of
  # Supabase. Publishing a lot in /admin/ writes a database row and nothing
  # else, so until something pushes to main there is no file at /lot/<id>/ and
  # a crawler gets 404.html, which answers 404. The lot is live for a person
  # and does not exist for Google, which is the exact problem the pre-render
  # was built to solve.
  #
  # So the deploy also runs on a clock. Same job, same commit, freshly queried
  # inventory: new lots get their file and their sitemap entry, closed ones get
  # their status corrected, within half a day of the change. Twice daily rather
  # than hourly because auctions run for days, not minutes, and a build that
  # fails on an unreachable Supabase leaves the last good deploy serving.
  #
  # Not on the hour: GitHub delays scheduled runs at peak times.
  schedule:
    - cron: "17 5,17 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One real file per static path, so /packages returns 200 instead of the
      # 404 a Pages fallback gives, and so the head is already correct before any
      # JavaScript runs. That second part is the one that matters: WhatsApp,
      # Slack, X and Google's first pass do not execute our router, so a
      # client-side title is a title they never see. Also writes 404.html as the
      # fallback for /lot/<id>, which is per-record and cannot be pre-rendered.
      #
      # Generated here rather than committed: sixteen copies of a 450 kB file
      # would be 7 MB of duplication in the repo, stale the moment index.html
      # changes. The script fails the build if sitemap.xml promises a path it did
      # not write.
      - name: Pre-render static paths
        run: node build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
